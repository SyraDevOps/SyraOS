name: Build SyraOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build
      - name: Configure Debian Live
        run: sudo lb config --distribution trixie --binary-images iso-hybrid --archive-areas "main contrib non-free non-free-firmware" --debian-installer none
      - name: Build ISO
        run: sudo lb build
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: SyraOS-ISO
          path: live-image-amd64.hybrid.iso
